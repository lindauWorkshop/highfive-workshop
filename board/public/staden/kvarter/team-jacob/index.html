<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juryn</title>
<link rel="stylesheet" href="/staden/kvarter/team-jacob/style.css">
</head>
<body>
<header>
  <h1>Juryn</h1>
  <span id="kassa" class="kassa">0 kr</span>
  <span id="läge">·</span>
</header>

<div id="fråga" class="fråga tom">Ingen fråga har nått staden ännu.</div>

<!-- Obetalt ärende: bedömt, inlåst. Priset står där sammanfattningen skulle ha stått. -->
<div id="räkning" class="räkning" hidden>
  <div class="rad">
    <span class="etikett">handläggningsavgift</span>
    <span class="pris" id="räkning-pris">–</span>
  </div>
  <div class="mätare"><i id="räkning-fyllnad" style="width:0%"></i></div>
  <div class="rad under">
    <span id="räkning-läge">–</span>
    <span id="räkning-tid"></span>
  </div>
  <code id="räkning-hur"></code>
</div>

<div id="skålar" class="skålar" hidden>
  <div class="skål grannar">
    <span class="etikett">grannarnas median</span>
    <span class="tal" id="tal-grannar">–</span>
    <span class="under" id="under-grannar">inga betyg</span>
  </div>
  <div class="mot">mot</div>
  <div class="skål vald">
    <span class="etikett">Juryns val</span>
    <span class="tal" id="tal-vald">–</span>
    <span class="under" id="under-vald">–</span>
  </div>
</div>

<ul id="delsvar" class="delsvar"></ul>

<blockquote id="citat" class="citat" hidden>
  <p id="citat-text"></p>
  <cite id="citat-varför"></cite>
</blockquote>

<footer>
  <span id="köpt"></span>
  <span id="spridning"></span>
  <span id="bortvalt"></span>
</footer>

<script src="/staden/kvarter/team-jacob/app.js"></script>
</body>
</html>
