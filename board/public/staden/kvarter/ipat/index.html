<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyktstolpen</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="sken-tänker"><stop offset="0" stop-color="#ffb454" stop-opacity=".75"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>
    <radialGradient id="sken-svarat"><stop offset="0" stop-color="#ffe08a" stop-opacity=".8"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
    <radialGradient id="sken-godkänt"><stop offset="0" stop-color="#5fd7a7" stop-opacity=".75"/><stop offset="1" stop-color="#5fd7a7" stop-opacity="0"/></radialGradient>
    <radialGradient id="sken-tillbaka"><stop offset="0" stop-color="#ff7b54" stop-opacity=".45"/><stop offset="1" stop-color="#ff7b54" stop-opacity="0"/></radialGradient>
  </defs>
</svg>
<header>
  <h1>Lyktstolpen</h1>
  <span class="sub">frågor staden tänker om</span>
</header>
<ul class="nyckel" aria-label="teckenförklaring">
  <li><i class="tänker"></i>tänker</li><li><i class="svarat"></i>svarat</li><li><i class="godkänt"></i>godkänt</li><li><i class="tillbaka"></i>tänk om</li>
  <li>✦ delsvar</li><li>▮ föll</li>
</ul>
<div id="msg" role="status"></div>
<main id="gata"><p class="tom">Gatan är mörk. Ingen fråga har gått genom staden än, ställ en i Frågeporten.</p></main>
<section id="underjord" aria-label="Vattenlandet under gatan">
  <svg id="vattensvg" viewBox="0 0 360 196" role="img" aria-labelledby="vrubrik">
    <title id="vrubrik">Vattenlandet i genomskärning</title>
    <defs>
      <clipPath id="bassäng"><path d="M50 38h270v100q0 12 -12 12h-246q-12 0 -12 -12z"/></clipPath>
      <linearGradient id="vattnet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb8c9"/><stop offset="1" stop-color="#0b3a57"/></linearGradient>
      <radialGradient id="lyktsken"><stop offset="0" stop-color="#ffb454" stop-opacity=".55"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>
      <linearGradient id="djupet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1a2a"/><stop offset="1" stop-color="#02050a"/></linearGradient>
    </defs>
    <rect class="jord" x="0" y="12" width="360" height="184"/>
    <g class="galler"><rect x="0" y="0" width="360" height="12"/><path d="M60 0v12M90 0v12M120 0v12M150 0v12M180 0v12M210 0v12M240 0v12M270 0v12M300 0v12"/></g>
    <ellipse cx="105" cy="16" rx="40" ry="18" fill="url(#lyktsken)"/><ellipse cx="255" cy="16" rx="40" ry="18" fill="url(#lyktsken)"/>
    <path class="kant" d="M46 34h278v104q0 16 -16 16h-246q-16 0 -16 -16z"/>
    <g clip-path="url(#bassäng)">
      <rect x="50" y="38" width="270" height="112" class="tomt"/>
      <g id="vatten" style="transform:translateY(110px)">
        <path class="våg" d="M40 0q15 -4 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0v200h-330z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-30 0" dur="3s" repeatCount="indefinite"/></path>
      </g>
      <line id="överlinje" class="överlinje" x1="50" x2="320" y1="55" y2="55"/>
      <g id="badare"></g>
    </g>
    <path class="kana" d="M8 0v8q0 22 22 30q20 7 30 22"/>
    <g id="rutschbil"><title>rutschkanan</title><rect x="-5" y="-3" width="10" height="6" rx="2"/><animateMotion id="åkning" dur="2.2s" begin="indefinite" fill="remove" rotate="auto" path="M8 0v8q0 22 22 30q20 7 30 22"/></g>
    <g class="pump" transform="translate(338 128)">
      <rect x="-12" y="-14" width="24" height="28" rx="3"/>
      <g class="rotor"><path d="M0 -8v16M-8 0h16"/></g>
      <path class="rör" d="M-12 8h-18"/>
    </g>
    <g class="luckan" transform="translate(185 154)"><rect class="lock" x="-16" y="-2" width="32" height="5" rx="1"/></g>
    <rect x="0" y="162" width="360" height="34" fill="url(#djupet)"/>
    <path class="virvel" d="M185 160c-10 4 -14 10 -6 14s18 2 14 8s-14 6 -8 10"/>
    <text class="djuptext" x="356" y="190" text-anchor="end">Djupet</text>
    <text id="nivåtext" class="nivå" x="56" y="50">–</text>
    <text class="skylt" x="185" y="94" text-anchor="middle">STÄNGT</text>
  </svg>
  <div class="vrad"><h2>Vattenlandet</h2><span id="vstatus"></span></div>
  <ul id="vlogg"></ul>
</section>
<article id="detalj"></article>
<script src="lykta.js"></script>
<script src="vatten.js"></script>
</body>
</html>
