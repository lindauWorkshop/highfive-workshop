<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Arkivet</title>
<style>
  :root{--bg:#0f0d0a;--hylla:#1a1611;--kant:#2e261c;--fg:#ece3d4;--dim:#8f8272;--guld:#d9a84e;--grön:#5fd7a7;--röd:#e0786b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Menlo,monospace;overflow:hidden}
  header{display:flex;align-items:baseline;gap:10px;padding:10px 14px 8px;border-bottom:2px solid var(--kant)}
  h1{margin:0;font-size:17px;letter-spacing:.18em;color:var(--guld)}
  header small{color:var(--dim)} header b{margin-left:auto;color:var(--guld);font-weight:500}
  #hylla{padding:8px 10px;display:flex;flex-direction:column;gap:7px;height:calc(100% - 44px);overflow:hidden}
  .p{background:var(--hylla);border:1px solid var(--kant);border-left:6px solid var(--guld);border-radius:4px 8px 8px 4px;padding:7px 10px}
  .p.ny{animation:ny 1.6s ease-out} @keyframes ny{0%{box-shadow:0 0 0 2px var(--guld);transform:translateX(-10px)}100%{box-shadow:none;transform:none}}
  .p.föll{border-left-color:var(--röd)} .p.vald{border-left-color:var(--grön)} .p.tom{border-left-color:var(--dim)}
  .q{display:flex;gap:8px} .q span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .q i{color:var(--dim);font-style:normal}
  .src{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--dim);font-size:11px}
  .src u{text-decoration:none;border:1px solid var(--kant);border-radius:3px;padding:0 5px;color:var(--guld)}
  .dom{margin-left:auto;padding:0 6px;border-radius:3px;background:#2a2319;color:var(--fg)}
  .dom.föll{color:var(--röd)} .dom.vald{color:var(--grön)}
  .svar{margin-top:3px;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p.bränd{border-left-color:#4a4038;background:repeating-linear-gradient(135deg,#15120f 0 6px,#1a1611 6px 12px);opacity:.75}
  .p.bränd .q span{text-decoration:line-through;color:var(--dim)}
  .godis{color:#ff8fc7} .p.bränd.ny{animation:brinn 2.4s ease-out}
  @keyframes brinn{0%{box-shadow:0 0 0 2px #ff7a2f,0 0 18px #ff7a2f;background:#3a1d0c}60%{box-shadow:0 0 10px #ff7a2f}100%{box-shadow:none}}
  /* Hovra (eller tryck) på en pärm för att läsa allt */
  .full{display:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--kant);font-size:12px;white-space:pre-wrap;word-break:break-word}
  .full b{color:var(--guld);font-weight:500} .full p{margin:3px 0}
  .p{cursor:default} .p:hover,.p.öppen{background:#221c15}
  .p:hover .q span,.p.öppen .q span,.p:hover .svar,.p.öppen .svar{white-space:normal;overflow:visible}
  .p:hover .full,.p.öppen .full{display:block}
  /* Brandstationen */
  #station{margin:8px 10px 0;padding:6px 10px;border:1px solid var(--kant);border-radius:6px;background:#15110d;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:12px}
  #station b{color:var(--guld);font-weight:600;letter-spacing:.08em}
  #station .läge{color:#8fd694} #station.larm{border-color:#ff5b2e;background:#2a120a;animation:blåljus .6s steps(2) infinite}
  #station.larm .läge{color:#ff8a5b}
  @keyframes blåljus{50%{box-shadow:inset 0 0 0 2px #3a7bff}}
  #station .senast{flex-basis:100%;color:var(--dim);font-size:11px}
  .p.brinner{border-left-color:#ff5b2e;background:linear-gradient(90deg,#3a160a,#1a1611);animation:flamma .5s ease-in-out infinite alternate}
  @keyframes flamma{to{box-shadow:0 0 12px #ff5b2e88}}
  .p.sotad{border-left-color:#8a7f73;background-image:radial-gradient(#0000 60%,#00000055)}
  .sot{color:#b9ab98}
  .tomt{color:var(--dim);text-align:center;margin-top:28%;line-height:1.8}
</style></head>
<body>
<header><h1>ARKIVET</h1><small>stadens minne</small><b id="n"></b></header>
<div id="station"><b>🚒 BRANDSTATIONEN</b><span class="läge" id="läge">i beredskap</span><span id="kårstat"></span><span class="senast" id="senast"></span></div>
<div id="hylla"><div class="tomt">Hyllorna är tomma.<br>Ställ en fråga till staden, så slår Arkivet upp vad den redan sagt.<br><small>Tar sockret slut eldar Arkivet upp sitt äldsta minne.</small></div></div>
<script>
const sett = new Set();
let öppen = null;   // tryck på en pärm på pekskärm: den förblir utfälld mellan omritningar
document.addEventListener('click', e => { const p = e.target.closest('.p'); const id = p ? Number(p.dataset.id) : null; öppen = öppen === id ? null : id; document.querySelectorAll('.p').forEach(x => x.classList.toggle('öppen', Number(x.dataset.id) === öppen)); });
let först = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function station(k) {
  if (!k) return;
  const st = document.getElementById('station');
  st.classList.toggle('larm', !!k.ute);
  document.getElementById('läge').textContent = k.ute ? `UTRYCKNING till pärm [${k.ute.pärm}] · ${k.ute.lag.length} brandmän` : `i beredskap · ${k.brandmän.length} brandmän`;
  document.getElementById('kårstat').textContent = `${k.släckta} bränder släckta · ${k.bärgade} pärmar bärgade`;
  document.getElementById('senast').textContent = k.larm[0] ? k.larm[0].text : '';
}

function rita({ pärmar, totalt, brända = 0, brandkår }) {
  station(brandkår);
  document.getElementById('n').textContent = totalt ? `${totalt - brända} pärm${totalt - brända === 1 ? '' : 'ar'}${brända ? ` · 🔥 ${brända} uppätna` : ''}` : '';
  if (!pärmar.length) return;
  document.getElementById('hylla').innerHTML = pärmar.slice(0, 12).map(p => {
    const källor = p.delsvar?.källor || [];
    const klass = p.brinner ? 'brinner' : p.bränd ? 'bränd' : p.sotad ? 'sotad' : p.dom === 'arkivet föll' ? 'föll' : p.dom === 'arkivet valdes' ? 'vald' : (p.delsvar && !källor.length ? 'tom' : '');
    const dom = p.brinner ? '🔥 BRINNER' : p.bränd ? `🔥 blev ${p.bränd.godis}, bärgas snart` : p.godkänt ? 'godkänt' : p.dom || (p.fel ? 'spärrad' : p.delsvar ? 'väntar på dom' : 'slår upp…');
    const ny = !först && !sett.has(p.id + ':' + dom);
    sett.add(p.id + ':' + dom);
    return `<div class="p ${klass}${ny ? ' ny' : ''}${öppen === p.id ? ' öppen' : ''}" data-id="${p.id}">
      <div class="q"><span title="${esc(p.text)}">${p.varv > 1 ? `<i>varv ${p.varv} · </i>` : ''}${esc(p.text)}</span><i>#${p.id}</i></div>
      ${p.sotad ? `<div class="src sot">🚒 ${p.sotad.bärgad ? 'bärgad ur askan' : `släckt på ${p.sotad.sekunder} s`} av ${esc(p.sotad.lag[0])} · sotskadad men läsbar</div>` : ''}
      <div class="src">${p.bränd ? `<span class="godis">glömd · ${p.bränd.gram} g socker i sats [${p.bränd.sats}]</span>` : p.delsvar ? (källor.length ? 'källor ' + källor.map(k => `<u>[${k}]</u>`).join('') : 'inget i arkivet, sa det rakt ut') : ''}
        ${p.stenar.length ? `· ${p.stenar.length} sten${p.stenar.length === 1 ? '' : 'ar'}` : ''}
        <span class="dom ${klass}">${esc(dom)}</span></div>
      ${p.svar && !p.bränd ? `<div class="svar">staden: ${esc(p.svar.text)}</div>` : ''}
      <div class="full">${p.delsvar ? `<p><b>Arkivet:</b> ${esc(p.delsvar.text)}</p>` : ''}${p.stenar.map(st => `<p><b>sten${st.vår ? ' (vår)' : ''}:</b> ${esc(st.varför)}${st.fitness != null ? ` · ${st.fitness}` : ''}</p>`).join('')}${p.godkänt ? `<p><b>Vaktkuren:</b> ${esc(p.godkänt.omdöme)}</p>` : ''}${p.fel ? `<p><b>spärrad:</b> ${esc(p.fel)}</p>` : ''}</div>
    </div>`;
  }).join('');
  först = false;
}

const hämta = () => fetch('/t/highfive/arkiv').then(r => r.json()).then(rita).catch(() => {});
hämta(); setInterval(hämta, 4000);
</script></body></html>
